/* llama a la IA: función propia (avanzado) o la integrada. Devuelve {answer} o {error} */
async function aiCall(question, context, mode){
  const ep = (S.cfg.site.ai || '').trim();
  try{
    if(/^https:\/\//i.test(ep)){
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 30000);
      const r = await fetch(ep, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question, context, mode}), signal:ctl.signal});
      clearTimeout(tm);
      if(!r.ok) return {error:'http'};
      const j = await r.json(); return {answer:j.answer || j.text || ''};
    }
    if(!SV.on || !SV.tok) return {error:'off'};
    const st = await aiStatus(); if(!st || !st.ready) return {error:'sin_clave'};
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 45000);
    const r = await fetch(API + '?r=ai', {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + SV.tok}, body:JSON.stringify({question, context, mode}), signal:ctl.signal});
    clearTimeout(tm);
    if(r.status === 401){ authLost(); return {error:'sesion'}; }
    const j = await r.json().catch(() => ({}));
    return r.ok ? {answer:j.answer || ''} : {error:j.error || 'http'};
  }catch(e){ return {error:'red'}; }
}
const AI_ERR = {limite:'La IA llegó a su límite gratuito por ahora', clave:'La clave de Gemini no es válida', sin_clave:'La IA no está conectada', tiempo:'La IA tardó demasiado', red:'No hubo conexión con la IA', modelo:'El modelo de IA no respondió'};
function aiStatusHTML(){
  const custom = /^https:\/\//i.test((S.cfg.site.ai || '').trim());
  if(custom) return `<div class="ai-st on" id="ai-status"><b>IA conectada</b><span>Usando tu función propia.</span></div>`;
  if(!SV.on) return `<div class="ai-st" id="ai-status"><b>IA disponible al publicar en Netlify</b><span>Aquí funciona el asistente con reglas propias.</span></div>`;
  if(!SV.ai) return `<div class="ai-st" id="ai-status"><b>Revisando la IA…</b></div>`;
  if(SV.ai.ready) return `<div class="ai-st on" id="ai-status"><b>IA conectada · ${esc(SV.ai.provider)}</b><span>El asistente y el generador de notas redactan con IA (plan gratuito). Si se alcanza el límite del día, siguen funcionando con las reglas integradas.</span></div>`;
  return `<div class="ai-st off" id="ai-status"><b>Activa la IA gratis (Google Gemini)</b>
    <ol><li>Entra a <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con una cuenta de Google y pulsa <b>Create API key</b>.</li>
    <li>En Netlify: tu sitio → <b>Site configuration → Environment variables → Add a variable</b>. Nombre: <code>GEMINI_API_KEY</code>; valor: la clave.</li>
    <li>En Netlify: <b>Deploys → Trigger deploy → Deploy site</b>. Al terminar, vuelve a esta sección.</li></ol>
    <span>La clave queda guardada solo en el servidor; nunca se ve en la página.</span></div>`;
}
try{ SV.tok = localStorage.getItem('tf_tok'); SV.def = localStorage.getItem('tf_def') === '1'; }catch(e){}
const absU = u => u && u.startsWith('/') ? location.origin + u : u;
async function api(r, o = {}){
  const h = {...(o.h || {})};
  if(SV.tok) h.Authorization = 'Bearer ' + SV.tok;
  let body = o.body;
  if(o.json !== undefined){ h['Content-Type'] = 'application/json'; body = JSON.stringify(o.json); }
  return fetch(API + '?r=' + r + (o.q || ''), {method:o.m || 'GET', headers:h, body, keepalive:!!o.keep});
}
function setTok(t, def){
  SV.tok = t; if(def !== undefined) SV.def = !!def;
  try{ if(t){ localStorage.setItem('tf_tok', t); localStorage.setItem('tf_def', SV.def ? '1' : '0'); } else { localStorage.removeItem('tf_tok'); } }catch(e){}
}
function authLost(){
  setTok(null); SV.statsLoaded = false;
  if(document.body.classList.contains('is-admin')){ toast('Tu sesión terminó. Vuelve a entrar.'); renderLogin(); }
}
let pushing = false, pushAgain = false;
async function pushServer(){
  if(pushing){ pushAgain = true; return; }
  pushing = true; setStatus('saving');
  try{
    const {stats, ...rest} = S;
    const r = await api('state', {m:'PUT', json:rest});
    if(r.status === 401){ authLost(); return; }
    if(!r.ok) throw new Error('http ' + r.status);
    setStatus('srv');
  }catch(e){ setStatus('err', 'No se pudo guardar en el servidor. Revisa tu conexión.'); }
  finally{ pushing = false; if(pushAgain){ pushAgain = false; pushServer(); } }
}
async function uploadMedia(blob){
  const r = await api('media', {m:'POST', body:blob, h:{'Content-Type':blob.type || 'application/octet-stream'}});
  if(r.status === 401){ authLost(); throw new Error('sesion'); }
  if(r.status === 413) throw new Error('grande');
  if(!r.ok) throw new Error('subida');
  return (await r.json()).url;
}
async function loadStats(){
  if(!SV.on || !SV.tok || SV.statsLoaded) return;
  try{
    const r = await api('stats'); if(r.status === 401) return authLost();
    const j = await r.json(); if(!j.ok) return;
    SV.statsLoaded = true;
    const base = {views:{}, clicks:{}, daily:{}, imp:{}, time:{}, reads:{}, adimp:{}, adclk:{}};
    S.stats = Object.assign(base, j.stats || {});
    if(document.body.classList.contains('is-admin') && ['stats', 'inicio', 'ai', 'ads'].includes(ad.sec)) renderAdmin();
  }catch(e){}
}
/* eventos de lectura de los visitantes: se mandan en lotes */
let EVQ = {};
function qAdd(k, key, n){ if(!SV.on) return; (EVQ[k] = EVQ[k] || {})[key] = (EVQ[k][key] || 0) + (n || 1); }
function flushEv(beacon){
  if(!SV.on || !Object.keys(EVQ).length) return;
  const body = JSON.stringify(EVQ); EVQ = {};
  if(beacon && navigator.sendBeacon) navigator.sendBeacon(API + '?r=track', new Blob([body], {type:'application/json'}));
  else fetch(API + '?r=track', {method:'POST', headers:{'Content-Type':'application/json'}, body, keepalive:true}).catch(() => {});
}
setInterval(() => flushEv(false), 10000);
addEventListener('pagehide', () => flushEv(true));
document.addEventListener('visibilitychange', () => { if(document.hidden) flushEv(true); });

/* pantalla de acceso */
function renderLogin(){
  let el = $('#login');
  if(!el){
    el = document.createElement('div'); el.id = 'login';
    el.innerHTML = `<form class="lg-card" autocomplete="on">
      <div class="logo lg-logo"><span class="l1">TRAS</span><span class="l2">FONDO</span><span class="l3">Yucatán</span></div>
      <h2>Administrador</h2><p class="sub">Escribe la contraseña para editar el sitio.</p>
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <div class="f"><label for="lg-pw">Contraseña</label><input class="fi" id="lg-pw" type="password" autocomplete="current-password" required></div>
      <p class="lg-err" role="alert"></p>
      <button type="submit" class="btn red" id="lg-go">Entrar</button>
      <a class="lg-back" href="${href('')}">Volver al sitio</a></form>`;
    document.body.appendChild(el);
    el.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = $('#lg-pw').value, b = $('#lg-go'), er = el.querySelector('.lg-err');
      if(!pw) return;
      b.disabled = true; b.textContent = 'Entrando…'; er.textContent = '';
      try{
        const r = await api('login', {m:'POST', json:{password:pw}}), j = await r.json().catch(() => ({}));
        if(!r.ok){ er.textContent = j.error || 'No se pudo entrar'; el.querySelector('.lg-card').animate([{transform:'translateX(-8px)'}, {transform:'translateX(8px)'}, {transform:'none'}], {duration:300}); return; }
        setTok(j.token, j.def); el.remove(); route();
      }catch(err){ er.textContent = 'No hay conexión con el servidor.'; }
      finally{ if(b.isConnected){ b.disabled = false; b.textContent = 'Entrar'; } }
    });
  }
  el.querySelector('.lg-back').setAttribute('href', href(''));
  setTimeout(() => { const i = $('#lg-pw'); if(i) i.focus(); }, 50);
}

/* sección Acceso */
function tplCuenta(){
  const st = SV.on
    ? `<div class="srv on"><b>Conectado al servidor de Netlify.</b> Lo que guardes aquí se publica para todos los visitantes, y las estadísticas son las lecturas reales del sitio.</div>`
    : `<div class="srv"><b>Modo local.</b> Los cambios se guardan solo en este navegador. Para guardarlos en el servidor, publica el sitio con sus funciones (ver el archivo LEEME del ZIP).</div>`;
  if(!SV.on) return `<div class="ac" data-tour="cuenta"><h3>Estado</h3>${st}</div>`;
  return `<div class="ac" data-tour="cuenta"><h3>Estado</h3>${st}</div>
    <div class="ac"><h3>Cambiar contraseña</h3>
      ${SV.def ? '<div class="warn">Estás usando la contraseña inicial. Cámbiala antes de compartir el enlace del administrador.</div>' : '<p class="sub">Al cambiarla se cierran las sesiones abiertas en otros equipos.</p>'}
      <form id="pw-form" autocomplete="on"><input type="text" name="username" value="admin" autocomplete="username" hidden>
      <div class="g3">
        <div class="f"><label for="pw-cur">Contraseña actual</label><input class="fi" id="pw-cur" type="password" autocomplete="current-password" required></div>
        <div class="f"><label for="pw-new">Nueva contraseña</label><input class="fi" id="pw-new" type="password" autocomplete="new-password" minlength="8" required><span class="hint">Mínimo 8 caracteres.</span></div>
        <div class="f"><label for="pw-rep">Repite la nueva</label><input class="fi" id="pw-rep" type="password" autocomplete="new-password" required></div>
      </div>
      <div class="dls"><button type="submit" class="btn red" id="pw-go">Cambiar contraseña</button></div></form></div>
    <div class="ac"><h3>Sesión</h3><p class="sub">Tu sesión dura 7 días en este navegador.</p><div class="dls"><button type="button" class="btn ghost danger" data-act="logout">Cerrar sesión</button></div></div>`;
}
async function changePw(){
  const cur = $('#pw-cur').value, nw = $('#pw-new').value, rp = $('#pw-rep').value, b = $('#pw-go');
  if(nw.length < 8) return toast('La nueva contraseña debe tener al menos 8 caracteres');
  if(nw !== rp) return toast('Las contraseñas nuevas no coinciden');
  b.disabled = true; b.textContent = 'Cambiando…';
  try{
    const r = await api('password', {m:'POST', json:{current:cur, next:nw}}), j = await r.json().catch(() => ({}));
    if(r.status === 401) return authLost();
    if(!r.ok) return toast(j.error || 'No se pudo cambiar la contraseña');
    setTok(j.token, false); toast('Contraseña cambiada'); renderAdmin();
  }catch(e){ toast('No hay conexión con el servidor'); }
  finally{ if(b.isConnected){ b.disabled = false; b.textContent = 'Cambiar contraseña'; } }
}
adBody.addEventListener('submit', e => { if(e.target.id === 'pw-form'){ e.preventDefault(); changePw(); } });

/* =========================================================
   ARRANQUE
   ========================================================= */
(async () => {
  S = loadState(); migrate(); fixSlots();
  if(PATHMODE){
    try{
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 5000);
      const r = await fetch(API + '?r=state', {signal:ctl.signal, cache:'no-store'}); clearTimeout(tm);
      const j = await r.json();
      if(j && j.ok){
        SV.on = true; SV.empty = !j.state;
        if(j.state){ const local = S.stats; S = hydrate(j.state); S.stats = Object.assign(S.stats, local); migrate(); fixSlots(); }
      }
    }catch(e){}
  }
  await preload();
  route();
})();

</script>
