<style>
:root{
  --navy:#0a1163; --navy2:#101b86; --red:#d3141f; --red2:#e8202b;
  --ink:#10143a; --muted:#5c6179; --line:#e7e9f1; --soft:#f5f6fb;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block}
.wrap{max-width:1216px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid #ff8a92;outline-offset:2px}

/* barra de carga superior */
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#ff3b47,#ff8a92);z-index:200;box-shadow:0 0 10px rgba(255,59,71,.7)}

/* ---------- Cabecera ---------- */
.top{background:linear-gradient(180deg,#0a1163,#0b1470);color:#fff;animation:drop .7s var(--ease) both}
@keyframes drop{from{transform:translateY(-100%)}to{transform:none}}
.top-in{display:flex;align-items:center;height:110px;gap:22px}
.logo{display:flex;flex-direction:column;align-items:flex-start;line-height:1;transition:transform .35s var(--ease)}
.logo:hover{transform:scale(1.04)}
.l1{font-weight:900;font-size:26px;letter-spacing:.1em;margin-left:2px}
.l2{background:var(--red);font-weight:900;font-size:39px;padding:3px 12px 4px;margin:3px 0 2px;letter-spacing:.02em;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.l3{align-self:flex-end;font-weight:800;font-size:17px}
.sep{width:1px;height:62px;background:rgba(255,255,255,.35)}
.tag{font-style:italic;font-weight:500;font-size:17.5px;line-height:1.3;color:#fff}
.spacer{flex:1}
.loc{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.loc b{font-size:15px;font-weight:700}
.loc span{display:flex;align-items:center;gap:6px;font-weight:500}
.wx{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid rgba(255,255,255,.25)}
.wx b{display:block;font-size:17px;font-weight:700}
.wx span{font-size:12px;font-weight:500}
.soc{display:flex;gap:10px}
.soc a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--ease),box-shadow .3s}
.soc a:hover{transform:translateY(-4px) rotate(-6deg) scale(1.08);box-shadow:0 8px 16px rgba(0,0,0,.35)}
.soc svg{width:22px;height:22px}
.s-fb{background:#1877f2}.s-ig{background:linear-gradient(45deg,#f9a03c,#e1306c 50%,#833ab4)}.s-tk{background:#000}.s-x{background:#000}.s-yt{background:#f00}
.sc .soc a{width:34px;height:34px}

/* ---------- Navegación ---------- */
.nav{position:sticky;top:0;z-index:60;background:#fff;box-shadow:0 2px 10px rgba(10,17,99,.1)}
.nav-in{display:flex;align-items:stretch;height:46px}
.home{width:65px;background:var(--red);display:grid;place-items:center;margin-left:-16px;transition:background .25s}
.home:hover{background:#a8101a}
.home svg{width:24px;height:24px;transition:transform .3s var(--ease)}
.home:hover svg{transform:scale(1.18)}
.tabs{display:flex;flex:1;overflow-x:auto;scrollbar-width:none;justify-content:space-between;padding:0 14px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;display:flex;align-items:center;padding:0 14px;font-weight:800;font-size:15px;color:var(--navy);text-transform:uppercase;white-space:nowrap;transition:color .25s}
.tabs a::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:4px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.tabs a:hover{color:var(--red)}
.tabs a:hover::after,.tabs a.on::after{transform:scaleX(1)}
.tabs a.on{color:var(--red)}
.sbtn{width:52px;display:grid;place-items:center;color:var(--navy);transition:color .25s,transform .3s}
.sbtn:hover{color:var(--red);transform:scale(1.15)}
.sbtn svg{width:24px;height:24px}

/* buscador */
.sp{position:absolute;left:0;right:0;top:100%;background:#fff;box-shadow:0 18px 30px rgba(10,17,99,.18);max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
.sp.open{max-height:80vh;overflow:auto}
.sp-in{padding:18px 16px 22px;max-width:1216px;margin:0 auto}
.sp input{width:100%;font:inherit;font-size:20px;font-weight:600;padding:14px 18px;border:2px solid var(--line);border-radius:8px;outline:0;color:var(--ink);transition:border-color .25s,box-shadow .25s}
.sp input:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(10,17,99,.08)}
.sres{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.sempty{margin-top:16px;color:var(--muted);font-weight:600}

/* ---------- Layout principal ---------- */
main{padding:16px 0 10px;min-height:70vh}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.col-r{display:flex;flex-direction:column;gap:22px}

/* animación de entrada */
.rv{animation:rv .65s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rv{from{opacity:0;transform:translateY(16px)}}

/* imágenes */
.pic{position:relative;overflow:hidden;background:var(--g,linear-gradient(135deg,#1b2a8a,#0a1163))}
.pic::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);background-size:220% 100%;animation:sh 1.4s infinite}
.pic:has(img.on)::before{display:none}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s,transform .8s var(--ease)}
.pic img.on{opacity:1}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.card{cursor:pointer}
.card:hover .pic img.on{transform:scale(1.08)}

.pill{display:inline-block;background:var(--red);color:#fff;font-weight:800;text-transform:uppercase;border-radius:4px;letter-spacing:.01em}
.meta{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted)}
.meta svg{width:16px;height:16px;flex:none}

/* Hero + laterales */
.hg{display:grid;grid-template-columns:1.93fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:476px}
.hg.solo{grid-template-columns:1fr}
.ov{position:relative;border-radius:8px;overflow:hidden;color:#fff;isolation:isolate;transition:transform .45s var(--ease),box-shadow .45s}
.ov:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(10,17,99,.28)}
.ov .pic{position:absolute;inset:0;z-index:-2}
.ov::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(5,8,30,.55) 58%,rgba(3,5,20,.94) 100%)}
.ov .in{position:absolute;left:0;right:0;bottom:0;padding:22px}
.hero{grid-row:1/3}
.hero .pill{font-size:16px;padding:6px 15px;margin-bottom:12px}
.hero h2{font-size:36px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin-bottom:14px;transition:color .3s}
.hero:hover h2{color:#ffd9dc}
.hero .lead{border-left:4px solid var(--red);padding-left:12px;font-size:17px;line-height:1.35;font-weight:500;margin-bottom:14px;color:#f1f2fa}
.hero .meta{color:#fff;font-size:15px}
.hero .meta i{width:1px;height:16px;background:rgba(255,255,255,.7)}
.side{background:#05071a}
.side .in{padding:16px 18px}
.side .pill{font-size:13px;padding:5px 12px;margin-bottom:8px}
.side h3{font-size:20px;line-height:1.15;font-weight:800;margin-bottom:10px}
.side .meta{color:#fff;font-size:14px}

/* Últimas noticias */
.bh{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;padding:12px 16px;border-radius:4px;text-transform:uppercase;letter-spacing:.01em}
.bh i{font-style:italic;font-weight:900}
.bh.red{background:linear-gradient(90deg,#c4101a,#e41f2a);box-shadow:0 6px 14px rgba(211,20,31,.25)}
.bh.red::before{content:'';width:4px;height:22px;background:rgba(0,0,0,.28);transform:skewX(-14deg)}
.bh.navy{background:var(--navy)}
.bh.navy i{color:#ff3b47}
.late{display:flex;flex-direction:column}
.li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);transition:background .25s,padding .25s}
.li:last-child{border:0}
.li:hover{background:var(--soft);padding-left:8px;padding-right:8px;border-radius:6px}
.li .pic{width:108px;height:84px;border-radius:4px;flex:none}
.li h4{font-size:15px;line-height:1.22;font-weight:700;margin-bottom:8px;transition:color .25s}
.li:hover h4{color:var(--red)}
.li .meta{font-size:13.5px}

/* Banner */
.banner{position:relative;display:flex;align-items:center;height:85px;margin:14px 0 0;border-radius:6px;overflow:hidden;background:linear-gradient(90deg,#0a1163,#14208f);color:#fff;isolation:isolate;transition:box-shadow .35s}
.banner:hover{box-shadow:0 12px 24px rgba(10,17,99,.3)}
.banner .pic{position:absolute;left:0;top:0;bottom:0;width:42%;z-index:-1;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.bt{margin-left:30%;display:flex;flex-direction:column;align-items:center;line-height:1}
.bt b{font-size:25px;font-weight:800;letter-spacing:.03em}
.bt em{font-style:normal;background:var(--red);font-weight:900;font-size:36px;padding:4px 14px;margin-top:2px}
.bslash{width:3px;height:52px;background:var(--red);transform:skewX(-18deg);margin:0 22px}
.btxt{font-weight:500;font-size:18px;line-height:1.3;flex:1}
.bbtn{background:#fff;color:var(--navy);font-weight:800;font-size:15px;padding:12px 22px;border-radius:30px;margin-right:16px;transition:all .3s var(--ease)}
.banner:hover .bbtn{background:var(--red);color:#fff;transform:translateX(-4px)}

/* Secciones */
.sh{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;color:var(--navy);text-transform:uppercase;margin:26px 0 12px}
.sh::before{content:'';width:5px;height:20px;background:var(--red);transform:skewX(-18deg)}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pc .pic{aspect-ratio:2.1/1;border-radius:6px}
.pc .pill{background:#fdecee;color:var(--red);border:1px solid #f4b9bf;font-size:11px;padding:4px 9px;margin:10px 0 8px;transition:all .3s}
.pc:hover .pill{background:var(--red);color:#fff}
.pc h4{font-size:17px;line-height:1.22;font-weight:800;margin-bottom:10px;transition:color .25s}
.pc:hover h4,.mc:hover h4{color:var(--red)}
.pc .meta{font-size:14px}
.mc .pic{aspect-ratio:1.75/1;border-radius:6px}
.mc h4{font-size:16px;line-height:1.25;font-weight:700;margin-top:10px;transition:color .25s}
.mc small{display:block;margin-top:6px;color:var(--muted);font-size:13px;font-weight:500}

/* Opinión (sidebar) */
.opbox{background:#fff;border-radius:0 0 8px 8px;box-shadow:0 6px 20px rgba(10,17,99,.1);padding:4px 16px}
.op{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.op:last-child{border:0}
.av{position:relative;width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:linear-gradient(135deg,#1b2a8a,#d3141f);display:grid;place-items:center;color:#fff;font-weight:800;transition:transform .35s var(--ease)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op:hover .av{transform:scale(1.1) rotate(-4deg)}
.op h4{font-size:16px;line-height:1.2;font-weight:800;margin-bottom:5px;transition:color .25s}
.op:hover h4{color:var(--red)}
.op span{font-size:13px;color:var(--muted);font-weight:500}

/* Social card */
.sc{position:relative;height:172px;background:#fff;border-radius:6px;box-shadow:0 6px 20px rgba(10,17,99,.12);padding:22px 22px 20px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;right:0;width:100px;height:46px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%)}
.sc::after{content:'';position:absolute;bottom:0;left:0;width:90px;height:26px;background:var(--navy);clip-path:polygon(0 0,0 100%,100% 100%)}
.sc-top{display:flex;align-items:center;gap:12px}
.mini{display:flex;flex-direction:column;align-items:flex-start;line-height:1;color:var(--navy)}
.mini .l1{font-size:15px;letter-spacing:.08em}
.mini .l2{font-size:21px;color:#fff;padding:0 6px;border:0;margin:2px 0;box-shadow:none}
.mini .l3{font-size:9px;align-self:flex-end;color:var(--navy)}
.sc-top .v{width:1px;height:46px;background:var(--line)}
.sc-top p{font-size:12px;font-weight:800;color:var(--navy);line-height:1.3;border-left:0;position:relative;padding-left:14px}
.sc-top p::before{content:'';position:absolute;left:0;top:3px;border:6px solid transparent;border-left:8px solid var(--red)}
.sc .soc{justify-content:center;position:relative;z-index:2}

/* Vista de categoría */
.ch{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.ch h1{font-size:34px;font-weight:900;color:var(--navy);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.ch h1::before{content:'';width:7px;height:32px;background:var(--red);transform:skewX(-18deg)}
.ch p{color:var(--muted);font-weight:500}
.empty{padding:40px;text-align:center;color:var(--muted);font-weight:600;background:var(--soft);border-radius:8px}
.opgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.opc{display:flex;gap:18px;padding:22px;border-radius:10px;background:#fff;box-shadow:0 6px 22px rgba(10,17,99,.1);cursor:pointer;transition:transform .4s var(--ease),box-shadow .4s}
.opc:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(10,17,99,.18)}
.opc .av{width:84px;height:84px;font-size:24px}
.opc h3{font-size:21px;line-height:1.2;font-weight:800;margin-bottom:8px;transition:color .25s}
.opc:hover h3{color:var(--red)}
.opc p{font-size:15px;line-height:1.45;color:var(--muted);margin-bottom:10px}
.opc b{font-size:13px;color:var(--navy)}

/* Artículo */
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);margin-bottom:16px;padding:8px 14px 8px 10px;border-radius:30px;background:var(--soft);transition:all .3s var(--ease)}
.back:hover{background:var(--navy);color:#fff;transform:translateX(-4px)}
.back svg{width:18px;height:18px}
.art .pill{font-size:14px;padding:6px 14px}
.art h1{font-size:40px;line-height:1.08;font-weight:900;color:var(--navy);margin:14px 0 14px;letter-spacing:-.015em}
.art .lead{font-size:20px;line-height:1.45;font-weight:500;border-left:4px solid var(--red);padding-left:16px;margin-bottom:16px;color:#2a2f55}
.art .by{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-bottom:18px}
.art .by b{color:var(--navy)}
.art .big{aspect-ratio:16/8.2;border-radius:10px;margin-bottom:22px}
.art .txt p{font-size:17.5px;line-height:1.75;margin-bottom:18px;max-width:72ch;color:#232850}
.art .txt p:first-child::first-letter{float:left;font-size:60px;line-height:.9;font-weight:900;color:var(--red);padding:6px 10px 0 0}
.share{display:flex;gap:10px;align-items:center;margin:8px 0 8px;font-weight:700;color:var(--navy)}
.share button{padding:9px 16px;border-radius:30px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;transition:all .3s var(--ease)}
.share button:hover{background:var(--red);transform:translateY(-3px)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;opacity:0;pointer-events:none;transition:all .4s var(--ease);z-index:300}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Skeleton */
.sk{background:linear-gradient(100deg,#eceef6 30%,#f8f9fd 50%,#eceef6 70%);background-size:220% 100%;animation:sh 1.3s infinite;border-radius:8px}
.sk-h{height:476px}
.sk-a{height:233px}.sk-s{height:90px;margin-bottom:12px}.sk-b{height:85px;margin-top:14px}
.sk-r{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.sk-r div{height:170px}

footer{margin-top:40px;background:var(--navy);color:#cfd3f5;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:22px;padding-bottom:22px;gap:12px;flex-wrap:wrap}
footer b{color:#fff}

@media(max-width:1020px){
  .grid{grid-template-columns:1fr}
  .tag,.wx{display:none}
  .row4,.sres{grid-template-columns:repeat(2,1fr)}
  .hg{height:auto;grid-template-columns:1fr;grid-template-rows:auto}
  .hero{grid-row:auto;height:440px}.side{height:210px}
  .hero h2{font-size:28px}
  .opgrid{grid-template-columns:1fr}
  .banner .btxt{display:none}.bt{margin-left:36%}
  .bslash{display:none}.bbtn{margin-left:auto}
}
@media(max-width:640px){
  .top-in{height:auto;padding:14px 16px;flex-wrap:wrap;gap:12px}
  .sep,.loc{display:none}.soc a{width:32px;height:32px}.soc svg{width:18px}
  .l2{font-size:30px}
  .row4,.sres{grid-template-columns:1fr}
  .art h1{font-size:28px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* =========================================================
   ADMINISTRADOR
   ========================================================= */
#admin{display:none;min-height:100vh;background:#f4f5fb;grid-template-columns:250px minmax(0,1fr)}
.is-admin #admin{display:grid}
.is-admin .top,.is-admin .nav,.is-admin main,.is-admin footer,.is-admin #bar{display:none}
.is-admin{background:#f4f5fb}

.ad-side{background:linear-gradient(180deg,#0a1163,#0b1470);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.ad-brand{display:flex;flex-direction:column;gap:10px;padding:0 8px}
.ad-brand .logo,.ad-brand .logo:hover{transform:none;align-self:flex-start}
.ad-brand .l1{font-size:19px}.ad-brand .l2{font-size:28px;padding:2px 9px 3px;margin:2px 0}.ad-brand .l3{font-size:12.5px}
.ad-brand small{font-weight:600;font-size:12.5px;color:#aab1ee;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
#ad-menu{display:flex;flex-direction:column;gap:6px}
#ad-menu button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:10px;color:#cfd3f5;transition:background .25s,color .25s,transform .25s var(--ease)}
#ad-menu button svg{width:22px;height:22px;flex:none}

.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:1;transform:translateY(-3px)}}
.ai-in{display:flex;gap:10px;margin-top:12px}
.ai-conn{margin-top:16px;font-size:13.5px}
.ai-conn summary{cursor:pointer;font-weight:800;color:var(--navy)}
.rec{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.rec-i{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.rec-n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px}
.rec-i em{font-style:normal;color:var(--muted);font-weight:700;margin-left:8px}
.rec-i span{font-size:13.5px}
.rec-b{height:8px;border-radius:5px;background:#eceef6;margin:6px 0;overflow:hidden}
.rec-b i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--navy),#3446c8)}
.rec-i:first-child .rec-b i{background:linear-gradient(90deg,#c4101a,#ff3b47)}
.idea{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff}
.idea .pill{font-size:11px;padding:3px 9px}
.idea h5{font-size:15.5px;font-weight:800;color:var(--navy);margin:6px 0 4px;line-height:1.25}
.idea small{display:block;color:var(--muted);font-weight:600;line-height:1.45}
.idea .btn{margin-top:10px;padding:8px 14px;font-size:13px}
.tlist{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.tlist button{text-align:left;padding:8px 10px;border-radius:8px;background:var(--soft);font-size:13.5px;font-weight:700;color:var(--ink);transition:background .2s}
.tlist button:hover{background:#e6e9f7}
.urlrow{display:flex;align-items:center;gap:8px}
.urlrow span{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.og{display:flex;flex-direction:column;max-width:430px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-top:10px;box-shadow:0 4px 14px rgba(10,17,99,.08)}
.og-i{aspect-ratio:1.91/1;background:linear-gradient(135deg,#0a1163,#d3141f) center/cover}
.og-b{padding:10px 14px 14px;background:#f2f3f7}
.og-b small{color:#65676b;font-size:12px;text-transform:uppercase;font-weight:600}
.og-b b{display:block;font-size:16px;color:#1c1e21;margin:3px 0;line-height:1.25}
.og-b span{font-size:13.5px;color:#65676b;line-height:1.4}
.ck{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:16px;font-size:14px;font-weight:700;color:var(--ink)}
.ck li{display:flex;gap:10px;align-items:flex-start}
.ck li::before{content:'✓';flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e3f5ea;color:#1b8a4b;font-weight:900;font-size:12px}
.ck li.no::before{content:'!';background:#fdecee;color:var(--red)}
.ck li small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.dls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
pre.code{margin-top:12px;background:#0d1230;color:#d8dcff;padding:14px 16px;border-radius:10px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;max-height:210px}
textarea.mono{font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:260px}

.col-l{display:flex;flex-direction:column;min-width:0}
.col-l .sh.dsk{margin-top:auto;padding-top:22px;margin-bottom:12px}
.adx-side{padding:36px 20px 18px;gap:12px}
.sh.mob{display:none}
.col-l+.col-r{padding-bottom:16px}
@media(max-width:1020px){.col-l+.col-r{padding-bottom:0}}
.grid+.grid{margin-top:12px}
@media(max-width:1020px){.sh.dsk{display:none}.sh.mob{display:flex}.grid+.grid{margin-top:0}}
.art .txt .adx-d{color:#e4e7fb;font-size:14.5px;line-height:1.45;margin:0;max-width:none}
#ade{display:flex;flex-direction:column;gap:18px}

/* =========================================================
   SISTEMA DE MOVIMIENTO (mismas curvas y tiempos en sitio y administrador)
   ========================================================= */
:root{--e-out:cubic-bezier(.16,1,.3,1);--e-spring:cubic-bezier(.34,1.56,.64,1);--e-io:cubic-bezier(.65,0,.35,1);--t1:.18s;--t2:.35s;--t3:.6s}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes slidein{from{opacity:0;transform:translateX(-18px)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes fadein{from{opacity:0}}

/* apariciones: solo cuando el bloque entra en pantalla */
.rv{animation:rv .8s var(--e-out) backwards paused;animation-delay:calc(var(--i,0)*65ms)}
.rv.vis{animation-play-state:running}
@keyframes rv{from{opacity:0;transform:translateY(22px) scale(.985)}}
.hero.vis .in>*{animation:rise .7s var(--e-out) backwards}
.hero.vis .in>:nth-child(1){animation-delay:.18s}.hero.vis .in>:nth-child(2){animation-delay:.26s}.hero.vis .in>:nth-child(3){animation-delay:.36s}.hero.vis .in>:nth-child(4){animation-delay:.46s}
.side.vis .in>*{animation:rise .6s var(--e-out) backwards .25s}
.bh{animation:slidein .6s var(--e-out) backwards .1s}
.late .li{animation:rise .55s var(--e-out) backwards}
.late .li:nth-child(1){animation-delay:.12s}.late .li:nth-child(2){animation-delay:.19s}.late .li:nth-child(3){animation-delay:.26s}.late .li:nth-child(4){animation-delay:.33s}
.opbox .op{animation:rise .55s var(--e-out) backwards .2s}
.opbox .op:nth-child(2){animation-delay:.28s}
.sh::before{transition:transform var(--t2) var(--e-spring)}
.sh.vis::before,.sh.dsk::before,.sh.mob::before{animation:barin .6s var(--e-spring) backwards .15s}
@keyframes barin{from{transform:skewX(-18deg) scaleY(0)}}

/* cambio de página */
#view{transition:opacity .17s ease,transform .17s ease}
#view.out{opacity:0;transform:translateY(8px)}
.sk{animation:sh 1.3s infinite,fadein .3s ease backwards}

/* imágenes: entran enfocando y el zoom es más lento y suave */
.pic img{transform:scale(1.06);transition:opacity .7s ease,transform 1.2s var(--e-out)}
.pic img.on{transform:none}
.card:hover .pic img.on{transform:scale(1.07)}
.ov::after{transition:opacity var(--t3) ease}
.ov:hover::after{opacity:.86}
.ov{transition:transform var(--t3) var(--e-out),box-shadow var(--t3) var(--e-out)}
.ov:hover{transform:translateY(-5px);box-shadow:0 22px 40px rgba(10,17,99,.3)}
.ov .pill{transition:transform var(--t2) var(--e-spring)}
.ov:hover .pill{transform:translateY(-3px)}
.pc,.mc{transition:transform var(--t3) var(--e-out)}
.pc:hover,.mc:hover{transform:translateY(-4px)}
.pc .pic,.mc .pic{transition:box-shadow var(--t3) var(--e-out)}
.pc:hover .pic,.mc:hover .pic{box-shadow:0 14px 26px rgba(10,17,99,.2)}
.li .pic{transition:transform var(--t2) var(--e-out)}
.li:hover .pic{transform:scale(1.04)}
.play{transition:transform var(--t2) var(--e-spring)}
.card:hover .play{transform:scale(1.15)}
.m-prev .play,.card:hover .m-prev .play{transform:translate(-50%,-50%)}

/* titulares: subrayado que se dibuja */
.cl{background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size .55s var(--e-out);padding-bottom:1px}
.card:hover .cl,.op:hover .cl,.opc:hover .cl,.cl:focus-visible{background-size:100% 2px}

/* cabecera y menú */
.logo{transition:transform var(--t2) var(--e-spring)}
.logo:hover{transform:scale(1.045) rotate(-1deg)}
.logo:active{transform:scale(.97)}
.soc a{transition:transform var(--t2) var(--e-spring),box-shadow var(--t2)}
.soc a:hover{transform:translateY(-4px) scale(1.1) rotate(-6deg)}
.soc a:active{transform:scale(.9)}
.nav{transition:box-shadow var(--t2) ease}
.nav.stuck{box-shadow:0 6px 22px rgba(10,17,99,.18)}
.tabs{position:relative}
.tabs a::after{display:none}
.tabs a{transition:color var(--t1) ease,transform var(--t1) ease}
.tabs a:active{transform:scale(.95)}
#tab-ink{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--red);border-radius:4px 4px 0 0;pointer-events:none;transition:transform .5s var(--e-out),width .5s var(--e-out),opacity .25s ease}
#read{position:absolute;left:0;right:0;top:100%;height:3px;background:linear-gradient(90deg,#c4101a,#ff3b47);transform:scaleX(0);transform-origin:left;pointer-events:none;transition:opacity .3s}
.home svg{transition:transform var(--t2) var(--e-spring)}
.home:hover svg{transform:scale(1.2) translateY(-1px)}
.home:active svg{transform:scale(.9)}
.sbtn{transition:color var(--t1),transform var(--t2) var(--e-spring)}
.sbtn:active{transform:scale(.85)}
.nav:has(.sp.open) .sbtn{color:var(--red);transform:rotate(90deg)}
.sp{transition:max-height .5s var(--e-out)}
.sp .sp-in{opacity:0;transform:translateY(-10px);transition:opacity .3s ease,transform .45s var(--e-out)}
.sp.open .sp-in{opacity:1;transform:none;transition-delay:.08s}

/* botones: presión, onda y elevación */
.btn,.chip,.bbtn,.adx-b,.share button,.seg button,.ad-foot button,.tlist button,.back,.it{-webkit-tap-highlight-color:transparent}
.btn,button.chip,.bbtn,.share button,.seg button,#ad-menu button,.ad-foot button,.tlist button,.back{position:relative;overflow:hidden}
.btn{transition:transform var(--t2) var(--e-out),box-shadow var(--t2) var(--e-out),background var(--t1) ease,border-color var(--t1) ease,color var(--t1) ease}
.btn.red:hover{box-shadow:0 10px 22px rgba(211,20,31,.35)}
.btn:active,button.chip:active,.share button:active,.seg button:active,.ad-foot button:active,.back:active{transform:scale(.96);transition-duration:.08s}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);pointer-events:none;animation:rp .65s var(--e-out) forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
.back svg{transition:transform var(--t2) var(--e-spring)}
.back:hover svg{transform:translateX(-4px)}
.btn.confirm{animation:nudge .4s var(--e-out)}
@keyframes nudge{20%{transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}

/* banners: destello al pasar el cursor */
.banner::after,a.adx::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-18deg);pointer-events:none}
.banner:hover::after,a.adx:hover::after{animation:sheen .9s var(--e-out)}
@keyframes sheen{to{left:130%}}
.banner .pic img.on{transition:opacity .7s,transform 1.4s var(--e-out)}
.banner:hover .pic img.on{transform:scale(1.06)}
.bbtn{transition:background var(--t2),color var(--t2),transform var(--t2) var(--e-spring)}
.adx::before{transition:transform var(--t3) var(--e-out)}
a.adx:hover::before{transform:rotate(45deg) scale(1.18)}
.adx-b{transition:background var(--t2),color var(--t2),transform var(--t2) var(--e-spring)}

/* opinión, redes y compartir */
.av{transition:transform var(--t2) var(--e-spring),box-shadow var(--t2)}
.op:hover .av,.opc:hover .av{box-shadow:0 8px 18px rgba(10,17,99,.25)}
.sc{transition:transform var(--t3) var(--e-out),box-shadow var(--t3) var(--e-out)}
.sc:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(10,17,99,.18)}
.sc::before,.sc::after{transition:transform var(--t3) var(--e-out)}
.sc:hover::before{transform:scale(1.15);transform-origin:top right}
.sc:hover::after{transform:scale(1.15);transform-origin:bottom left}
.share button{transition:background var(--t1),transform var(--t2) var(--e-spring)}
.toast{transition:opacity .3s ease,transform .5s var(--e-spring)}
.toast.on{transform:translate(-50%,0) scale(1)}
.toast:not(.on){transform:translate(-50%,24px) scale(.92)}

/* ---------- administrador ---------- */
.is-admin #admin{animation:fadein .35s ease}
#ad-menu{position:relative}
#ad-menu button{z-index:1;transition:color var(--t2) ease,transform var(--t2) var(--e-out)}
#ad-menu button.on{background:transparent}
#ad-menu button:not(.on):hover{background:rgba(255,255,255,.07)}
#ad-menu button svg{transition:transform var(--t2) var(--e-spring),color var(--t2)}
#ad-menu button:hover svg{transform:scale(1.12)}
#ad-menu button.on svg{transform:scale(1.08)}
#menu-ink{position:absolute;left:0;top:0;width:0;height:0;border-radius:10px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18);pointer-events:none;z-index:0}
#menu-ink.rdy{transition:transform .5s var(--e-out),width .5s var(--e-out),height .5s var(--e-out)}
.ad-top.enter>div:first-child>*{animation:slidein .5s var(--e-out) backwards}
.ad-top.enter>div:first-child>p{animation-delay:.06s}
#ad-body.enter>*{animation:rise .6s var(--e-out) backwards}
#ad-body.enter>:nth-child(2){animation-delay:.07s}#ad-body.enter>:nth-child(3){animation-delay:.14s}#ad-body.enter>:nth-child(4){animation-delay:.21s}#ad-body.enter>:nth-child(n+5){animation-delay:.28s}
#ad-body.enter .ad-notes>.ad-list{animation:slidein .6s var(--e-out) backwards}
#ad-body.enter .ad-notes>:last-child>.ac{animation:rise .6s var(--e-out) backwards .08s}
#ad-body.enter .ad-notes>:last-child>.ac:nth-child(2){animation-delay:.16s}
#ad-body.enter .ad-notes>:last-child>.ac:nth-child(n+3){animation-delay:.24s}
#ad-body.enter .kpi{animation:pop .55s var(--e-spring) backwards}
#ad-body.enter .kpi:nth-child(2){animation-delay:.05s}#ad-body.enter .kpi:nth-child(3){animation-delay:.1s}#ad-body.enter .kpi:nth-child(4){animation-delay:.15s}#ad-body.enter .kpi:nth-child(5){animation-delay:.2s}#ad-body.enter .kpi:nth-child(6){animation-delay:.25s}#ad-body.enter .kpi:nth-child(7){animation-delay:.3s}
#ad-body.enter .ring{animation:ringin 1.1s var(--e-out) backwards .15s}
@keyframes ringin{from{--p:0}}
#ad-body.enter .ck li{animation:rise .45s var(--e-out) backwards;animation-delay:calc(.2s + var(--k,0)*45ms)}
#ad-body.enter .dn svg{animation:spinin 1s var(--e-out) backwards .2s}
@keyframes spinin{from{opacity:0;transform:rotate(-200deg) scale(.7)}}
.kpi{transition:transform var(--t2) var(--e-out),box-shadow var(--t2) var(--e-out)}
.kpi:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(10,17,99,.13)}
.kpi::before{transition:width var(--t2) var(--e-out)}
.kpi b,.perf b{font-variant-numeric:tabular-nums}
.kpi:hover::before{width:9px}
.it{transition:background var(--t1),border-color var(--t2),transform var(--t2) var(--e-out)}
.it:hover{transform:translateX(3px)}
.it.on{transform:none}
.it:active{transform:scale(.985)}
.rk-i{transition:background var(--t1),transform var(--t2) var(--e-out)}
.rk-i:hover{transform:translateX(4px)}
.rk-b i{transition:filter var(--t2)}
.rk-i:hover .rk-b i{filter:brightness(1.25)}
.fi{transition:border-color var(--t1) ease,box-shadow var(--t2) var(--e-out),background var(--t1)}
.media{transition:border-color var(--t2),background var(--t2)}
.media:hover{border-color:var(--navy);background:#fafbff}
.m-prev img,.m-prev video,.m-prev iframe{animation:fadein .5s ease}
.ad-status::before{transition:background var(--t2)}
.ad-status.saving::before{animation:pulse 1s ease-in-out infinite}
.ad-status:not(.saving):not(.err)::before{animation:okpop .5s var(--e-spring)}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
@keyframes okpop{from{transform:scale(2.2)}}
.seg button{transition:background var(--t2) var(--e-out),color var(--t2)}
.chip{transition:border-color var(--t1),color var(--t1),transform var(--t2) var(--e-spring),background var(--t1)}
.secs label{transition:border-color var(--t2),background var(--t2),transform var(--t2) var(--e-spring)}
.secs label:active{transform:scale(.95)}
.secs label:has(input:checked){animation:pop .35s var(--e-spring)}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:26px;background:#cfd3e6;position:relative;cursor:pointer;flex:none;transition:background var(--t2) ease}
.sw input::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform var(--t2) var(--e-spring)}
.sw input:checked{background:var(--red)}
.sw input:checked::after{transform:translateX(20px)}
.sw input:active::after{width:24px}
.prevbox .adx{animation:pop .4s var(--e-out)}
.msg.a .rec-b i{animation:grow .9s var(--e-out) backwards .2s}
.msg.a .idea{animation:rise .5s var(--e-out) backwards}
.msg.a .idea:nth-of-type(2){animation-delay:.08s}.msg.a .idea:nth-of-type(3){animation-delay:.16s}.msg.a .idea:nth-of-type(4){animation-delay:.24s}
.msg.old .rec-b i,.msg.old .idea{animation:none}
.idea{transition:transform var(--t2) var(--e-out),box-shadow var(--t2),border-color var(--t2)}
.idea:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(10,17,99,.1);border-color:#cfd3f5}
.tlist button{transition:background var(--t1),transform var(--t2) var(--e-out)}
.tlist button:hover{transform:translateX(3px)}
.og{transition:transform var(--t3) var(--e-out),box-shadow var(--t3)}
.og:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(10,17,99,.16)}
/* tutorial */
#tour.on #tour-tip{animation:pop .45s var(--e-spring)}
#tour-hole{transition:all .55s var(--e-out);animation:holep 1.8s ease-in-out infinite}
@keyframes holep{50%{outline-offset:5px;outline-color:rgba(255,59,71,.45)}}
#tour-tip{transition:left .55s var(--e-out),top .55s var(--e-out)}
#tour-tip.swap>.tp-s,#tour-tip.swap>h4,#tour-tip.swap>p{animation:rise .4s var(--e-out) backwards}
#tour-tip.swap>h4{animation-delay:.05s}#tour-tip.swap>p{animation-delay:.1s}
.tp-dots i{transition:background .4s ease,transform .4s var(--e-spring)}
.tp-dots i.on{transform:scaleY(1.4)}
@media(prefers-reduced-motion:reduce){.rv{animation:none}#view.out{opacity:1;transform:none}.pic img{transform:none}}

/* ---------- resaltado deslizante en listas (sin mover el texto) ---------- */
.late,.opbox{position:relative}
.glide{position:absolute;left:-8px;right:-8px;top:0;height:0;border-radius:10px;background:var(--soft);opacity:0;pointer-events:none;z-index:0;transition:transform .5s var(--e-out),height .5s var(--e-out),opacity .35s ease}
.glide.on{opacity:1}
.opbox .glide{left:-10px;right:-10px}
.li,.op{position:relative;z-index:1}
.li:hover{background:transparent;padding:12px 0;border-radius:0}
.li>div:last-child,.op>div{transition:transform .5s var(--e-out)}
.li:hover>div:last-child,.op:hover>div{transform:translateX(5px)}
.li h4,.op h4{transition:color .35s ease}
.it.on{animation:selin .45s var(--e-out)}
@keyframes selin{from{border-color:transparent;background:transparent}}

/* ---------- nota en ventana flotante ---------- */
html.mdl-lock{overflow:hidden}
.mdl{position:fixed;inset:0;z-index:150}
.mdl-bg{position:absolute;inset:0;background:#060a2e;overflow:hidden}
.mdl-bg::before{content:'';position:absolute;inset:-80px;background:var(--mi,none) center/cover,var(--mg,linear-gradient(135deg,#1b2a8a,#0a1163));filter:blur(48px) saturate(1.3);opacity:.6;transform:scale(1.08);transition:background .6s ease}
.mdl-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(112deg,transparent 0 70%,rgba(211,20,31,.28) 70% 73.5%,transparent 73.5%),linear-gradient(112deg,transparent 0 76%,rgba(211,20,31,.12) 76% 77.2%,transparent 77.2%),radial-gradient(120% 85% at 50% 0%,rgba(16,27,134,.35),rgba(6,10,46,.9) 72%)}
.mdl-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:52px 16px 72px;cursor:zoom-out}
.mdl-panel{position:relative;max-width:860px;margin:0 auto;background:#fff;border-radius:18px;overflow:clip;box-shadow:0 40px 100px rgba(0,0,0,.5);cursor:auto}
.mdl-bar{position:sticky;top:0;height:0;z-index:6}
.mdl-prog{position:absolute;left:0;right:0;top:0;height:4px;z-index:7;pointer-events:none}
.mdl-panel:focus{outline:none}
.mdl-prog i{display:block;height:100%;background:linear-gradient(90deg,#c4101a,#ff3b47);transform:scaleX(0);transform-origin:left}
.mdl-x{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:50%;background:rgba(10,17,99,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .45s var(--e-spring),background .25s ease}
.mdl-x:hover{background:var(--red);transform:rotate(90deg) scale(1.06)}
.mdl-x:active{transform:rotate(90deg) scale(.92)}

/* ---------- administrador más despejado ---------- */
.ad-main{padding:0 40px 80px}

.ac{padding:26px 28px}

.ad-side{gap:18px}
.qas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}
.qa{display:flex;align-items:center;gap:14px;text-align:left;padding:20px;border-radius:14px;background:#fff;color:var(--navy);box-shadow:0 4px 18px rgba(10,17,99,.07);transition:transform var(--t2) var(--e-out),box-shadow var(--t2) var(--e-out);position:relative;overflow:hidden}

.qa:hover svg{transform:scale(1.15) rotate(-6deg)}
.qa b{display:block;font-size:16px;font-weight:800}
.qa small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:3px}
.qa.red{background:linear-gradient(135deg,#c4101a,#e8202b);color:#fff;box-shadow:0 10px 24px rgba(211,20,31,.3)}

#ad-body.enter .qa{animation:pop .5s var(--e-spring) backwards}
#ad-body.enter .qa:nth-child(2){animation-delay:.05s}#ad-body.enter .qa:nth-child(3){animation-delay:.1s}#ad-body.enter .qa:nth-child(4){animation-delay:.15s}

/* ---------- recortes de la nota ---------- */

.clips-h{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:color-mix(in srgb,var(--cd) 72%,transparent);padding:5px 12px;border-radius:30px;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s var(--e-out)}

.clips-list{display:flex;flex-direction:column;gap:20px}

.clip-in>span{display:block;font-family:Georgia,'Times New Roman',serif;font-size:13.5px;line-height:1.42}
.tape{position:absolute;left:50%;top:-8px;width:58px;height:19px;z-index:2;transform:translateX(-50%) rotate(-3deg);background:color-mix(in srgb,var(--ca) 45%,rgba(255,255,255,.75));opacity:.86;box-shadow:0 1px 3px rgba(0,0,0,.18)}

mark.kp.cut{animation:cutln 1.1s ease}
@keyframes cutln{0%{outline:1.5px dashed transparent;outline-offset:3px}25%{outline:1.5px dashed color-mix(in srgb,var(--cd) 70%,transparent);outline-offset:3px}100%{outline:1.5px dashed transparent;outline-offset:3px}}
mark.kp.pulse{animation:kpp 1.6s ease}
@keyframes kpp{0%,100%{box-shadow:0 0 0 0 transparent}25%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ca) 45%,transparent)}}
mark.kp.hot{background-size:100% 100%;transition:background-size .3s ease}
/* celular y tablet: los recortes se guardan en un botón flotante */
.mdl.inl .clips{left:0;right:0;width:auto;top:0;bottom:0;display:block}
.mdl.inl .clips-h{display:none}
.mdl.inl .clip-pill{display:inline-flex;align-items:center;position:absolute;left:14px;bottom:16px;z-index:2;pointer-events:auto;padding:11px 16px;border-radius:30px;background:var(--navy);color:#fff;font-weight:800;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(20px);transition:opacity .4s ease,transform .5s var(--e-spring)}
.mdl.inl .clips.has .clip-pill{opacity:1;transform:none}
.clip-pill.bump{animation:bump .5s var(--e-spring)}
@keyframes bump{40%{transform:scale(1.14)}}
.mdl.inl .clips-list{position:absolute;left:0;right:0;bottom:0;max-height:64vh;overflow:auto;padding:26px 20px 84px;gap:22px;background:color-mix(in srgb,var(--cd) 90%,#000);border-radius:20px 20px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.4);transform:translateY(105%);transition:transform .5s var(--e-out);pointer-events:auto}
.mdl.inl .clips.open .clips-list{transform:none}
.mdl.inl .clips.open{pointer-events:auto;background:rgba(0,0,0,.35)}
.mdl.inl .clip{max-width:420px;margin:0 auto}
/* icono en celular: pequeño sobre la portada, se oculta al bajar */
.mdl.inl .mdl-ico{display:block;width:46px;height:46px}
.mdl.inl .mdl-ico span{display:none}
.mdl.inl .mdl-ico,.mdl.inl .mdl-3d{transition:opacity .35s ease}
.mdl.inl.scrolled .mdl-ico,.mdl.inl.scrolled .mdl-3d{opacity:0}
.mdl.no3d .mdl-ico{display:none}

.mdl-ico canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.mdl.inl.scrolled .mdl-ico{opacity:0}

/* sin contornos blancos */
.mdl-ico{box-shadow:inset 0 -14px 26px color-mix(in srgb,var(--cd) 22%,transparent),0 18px 40px color-mix(in srgb,var(--cd) 48%,transparent)}
/* generador de notas */
.gen .badge{max-width:340px;text-align:center;line-height:1.4}
.gen-ideas .chip{font-size:12.5px;padding:7px 12px}
.gen-res{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;margin-top:20px;padding:18px;border-radius:14px;background:var(--soft);align-items:center}
.gen-img .pic{aspect-ratio:16/9;border-radius:10px;box-shadow:0 14px 30px rgba(10,17,99,.22)}
.gen-res h4{font-size:19px;font-weight:800;color:var(--navy);line-height:1.25;margin:10px 0 6px}
.gen-res p{font-size:14.5px;line-height:1.5;color:#2a2f55;margin-bottom:8px}
.gen-res .pill{font-size:12px;padding:4px 10px}
#gen-go:disabled{opacity:.75;cursor:progress}
@media(max-width:980px){.gen-res{grid-template-columns:1fr}}

/* acceso al administrador */
#login{position:fixed;inset:0;z-index:600;display:grid;place-items:center;padding:20px;background:radial-gradient(120% 90% at 20% 0%,#16239a,#0a1163 55%,#060a2e)}
.lg-card{width:min(400px,100%);background:#fff;border-radius:18px;padding:34px 30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:pop .5s var(--e-spring)}
.lg-logo{align-self:flex-start;color:var(--navy);margin-bottom:22px}
.lg-logo .l1{font-size:17px}.lg-logo .l2{font-size:26px;color:#fff;padding:2px 9px 3px;box-shadow:none}.lg-logo .l3{font-size:11px;color:var(--navy)}
.lg-card h2{font-size:24px;font-weight:900;color:var(--navy)}
.lg-card .f{margin-top:16px}
.lg-err{min-height:20px;margin:10px 0 6px;font-size:13.5px;font-weight:700;color:var(--red)}
.lg-card .btn{width:100%;padding:13px}
.lg-back{align-self:center;margin-top:16px;font-size:13.5px;font-weight:700;color:var(--muted)}
.lg-back:hover{color:var(--navy)}
.srv{margin-top:14px;padding:14px 16px;border-radius:12px;background:#fff6e6;border-left:5px solid #e0a100;font-size:14.5px;line-height:1.5;color:#3a2f10}
.srv.on{background:#e9f7ef;border-left-color:#1b8a4b;color:#14432a}

.live-card{border-left:6px solid #e0a100}
.live-card.on{border-left-color:#1b8a4b}
.live-card .sw{margin-top:0}
/* ===== texto enriquecido en la nota ===== */
.art .txt strong{font-weight:800;color:var(--ink)}
.art .txt em{font-style:italic}
.art .txt p a,.art .txt li a{color:var(--navy);font-weight:700;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px;transition:color .25s var(--e-out),text-decoration-color .25s}
.art .txt p a:hover,.art .txt li a:hover{color:var(--red);text-decoration-color:var(--navy)}
.art .txt .bul{list-style:none;margin:4px 0 22px;padding:0;max-width:72ch}
.art .txt .bul li{position:relative;padding:0 0 0 26px;margin:0 0 10px;font-size:17px;line-height:1.6;font-weight:600;color:#232850}
.art .txt .bul li::before{content:'';position:absolute;left:4px;top:.55em;width:10px;height:10px;background:var(--red);transform:skewX(-14deg)}
.mdl-panel .txt .bul{max-width:none}
.bfig{margin:8px 0 26px;max-width:72ch}
.mdl-panel .bfig{max-width:none}
.bfig img{display:block;width:100%;height:auto;border-radius:12px;background:#eef0f7}
.bfig figcaption{margin-top:8px;font-size:13px;font-weight:600;color:var(--muted);padding-left:12px;border-left:3px solid var(--red)}
.bemb{margin:8px 0 26px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bemb iframe{width:100%;border:0;border-radius:12px;background:#fff;box-shadow:0 10px 30px rgba(10,17,99,.12)}
.bemb.vid{align-items:stretch}
.bemb-v{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.bemb-v iframe,.bemb-v video{position:absolute;inset:0;width:100%;height:100%;border:0;box-shadow:none;border-radius:0}
.bemb-l{font-size:12.5px;font-weight:700;color:var(--muted)!important;text-decoration:none!important}
.bemb-l:hover{color:var(--red)!important}
.bemb.card{display:grid;gap:3px;align-items:start;padding:14px 18px;border-radius:12px;background:#f4f5fb;border-left:4px solid var(--red);text-decoration:none!important;max-width:72ch;transition:transform .3s var(--e-out),box-shadow .3s}
.bemb.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(10,17,99,.1)}
.bemb.card b{color:var(--navy);font-size:15px}.bemb.card span{font-size:13px;color:var(--muted);word-break:break-all}.bemb.card em{font-style:normal;font-size:12.5px;font-weight:800;color:var(--red)}
/* ===== editor visual ===== */
.rt-pop .rt-t{display:none}.rt-pop.two .rt-t{display:block}

.rich-f{position:relative}
.rt{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;border:2px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:#f6f7fb;position:sticky;top:64px;z-index:3}
.rt-b{display:inline-flex;align-items:center;gap:6px;min-width:36px;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--e-spring)}
.rt-b svg{width:18px;height:18px;flex:none}
.rt-b:hover{background:#fff;color:var(--red);box-shadow:0 2px 8px rgba(10,17,99,.08)}
.rt-b:active{transform:scale(.94)}
.rt-l{font-size:17px;font-family:Georgia,serif;line-height:1}
.rt-s{width:1px;height:22px;background:var(--line);margin:0 4px}
.rt-pop{border:2px solid var(--line);border-bottom:0;background:#fff;padding:10px 12px;display:grid;gap:8px;animation:rtIn .3s var(--e-out)}
.rt-pop[hidden]{display:none}
.rt-pop label{font-size:13px;font-weight:700;color:var(--muted)}
.rt-pr{display:flex;gap:8px;flex-wrap:wrap}.rt-pr .fi{flex:1 1 240px;min-height:0}
@keyframes rtIn{from{opacity:0;transform:translateY(-6px)}}
.fi.rich{min-height:320px;max-height:70vh;overflow:auto;border-radius:0 0 10px 10px;font-size:16px;line-height:1.65;padding:14px 18px;resize:vertical;cursor:text}
.fi.rich:focus{border-color:var(--navy)}
.fi.rich p{margin:0 0 12px}
.fi.rich b,.fi.rich strong{font-weight:800}
.fi.rich a{color:var(--navy);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px}
.fi.rich.empty::before{content:attr(data-ph);color:#9aa0b8;position:absolute;pointer-events:none}
.rb-img,.rb-emb{position:relative;margin:6px 0 14px;border-radius:12px;user-select:none}
.rb-img{display:grid;gap:8px;padding:8px;background:#f4f5fb;max-width:520px}
.rb-img img{width:100%;max-height:300px;object-fit:cover;border-radius:8px;display:block}
.rb-cap{font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:0;user-select:text}
.rb-cap:focus{border-color:var(--navy)}
.rb-emb{display:flex;align-items:center;gap:10px;padding:12px 44px 12px 12px;background:#f4f5fb;border-left:4px solid var(--red);max-width:520px}
.rb-net{flex:none;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--navy);padding:4px 8px;border-radius:6px}
.rb-net.n-fb{background:#1877f2}.rb-net.n-ig{background:#c13584}.rb-net.n-x{background:#111}.rb-net.n-tk{background:#111}.rb-net.n-yt{background:#e00}.rb-net.n-web{background:var(--muted)}
.rb-u{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:#fff;color:var(--red);font-size:18px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(10,17,99,.15);transition:transform .25s var(--e-spring),background .2s}
.rb-x:hover{transform:scale(1.12);background:var(--red);color:#fff}
.rb-img .rb-x{top:14px;right:14px}
.wc{margin-left:6px;font-weight:700;color:var(--navy)}
.chk-n{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--muted);background:#f6f7fb;border-radius:8px;padding:8px 10px}
.chk li.kwc{font-weight:700}
@media (max-width:640px){.rt{top:56px}.rt-b span{display:none}.fi.rich{min-height:260px}.bemb iframe{max-width:100%!important}}

/* ===== crédito SOWP en el pie ===== */
.sowp{display:inline-flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:#cfd3f5;font-size:13px;font-weight:600;text-decoration:none;letter-spacing:.01em;position:relative;overflow:hidden;isolation:isolate;transition:color .3s var(--e-out),transform .35s var(--e-spring),box-shadow .35s var(--e-out)}
.sowp::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--red);transform:translateX(-101%) skewX(-14deg);transform-origin:left;transition:transform .45s var(--e-out)}
.sowp svg{width:18px;height:18px;flex:none;color:#25d366;transition:color .3s,transform .45s var(--e-spring)}
.sowp b{color:#fff;font-weight:900;letter-spacing:.06em}
.sowp:hover,.sowp:focus-visible{color:#fff;transform:translateY(-2px);box-shadow:0 10px 24px rgba(211,20,31,.35);outline:0}
.sowp:hover::before,.sowp:focus-visible::before{transform:translateX(0) skewX(0)}
.sowp:hover svg,.sowp:focus-visible svg{color:#fff;transform:rotate(-12deg) scale(1.1)}
.sowp:active{transform:translateY(0) scale(.97)}
@media (max-width:640px){footer .wrap{justify-content:center;text-align:center}.sowp{order:3}}

/* ===== estado de la IA ===== */
.ai-st{margin-top:14px;display:grid;gap:6px;padding:14px 16px;border-radius:12px;background:#f6f7fb;border-left:5px solid #e0a100;font-size:13.5px;line-height:1.5;color:var(--ink)}
.ai-st.on{border-left-color:#1b8a4b}
.ai-st b{font-size:14px;color:var(--navy)}.ai-st.on b::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#1b8a4b;margin-right:8px;box-shadow:0 0 0 4px rgba(27,138,75,.15);animation:aiPulse 2s ease-in-out infinite}
.ai-st span{color:var(--muted)}.ai-st ol{margin:2px 0 2px 18px;padding:0;display:grid;gap:4px}.ai-st a{color:var(--red);font-weight:700}
.ai-st code{background:#fff;padding:1px 6px;border-radius:5px;font-size:12.5px;color:var(--navy);font-weight:700}
@keyframes aiPulse{50%{box-shadow:0 0 0 7px rgba(27,138,75,0)}}
.msg .ai-via{font-size:11.5px;color:var(--muted);margin-top:6px}
.msg .bul{margin:6px 0 6px 2px;padding-left:18px}.msg .bul li{margin:2px 0}

/* ===== notas sin frases resaltadas ===== */
.mdl.nokp .clips{display:none!important}
/* ===== menú de secciones en celular ===== */
.mbtn{display:none;align-items:center;gap:10px;padding:0 14px;border:0;background:transparent;color:var(--navy);font:inherit;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;flex:1}
.hb{position:relative;width:22px;height:16px;display:inline-block}
.hb i{position:absolute;left:0;height:3px;border-radius:2px;background:var(--navy);transition:transform .35s var(--e-out),width .35s var(--e-out),background .25s}
.hb i:nth-child(1){top:0;width:22px}.hb i:nth-child(2){top:6.5px;width:16px;background:var(--red)}.hb i:nth-child(3){top:13px;width:22px}
.mbtn:hover .hb i:nth-child(2){width:22px}
.mbtn[aria-expanded="true"] .hb i:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.mbtn[aria-expanded="true"] .hb i:nth-child(2){width:0}
.mbtn[aria-expanded="true"] .hb i:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.mm{position:fixed;inset:0;z-index:200;background:rgba(5,8,30,0);transition:background .4s var(--e-out)}
.mm.on{background:rgba(5,8,30,.55)}
.mm[hidden]{display:none}
.mm-panel{position:absolute;top:0;left:0;bottom:0;width:min(86vw,360px);background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:18px 22px 26px;overflow-y:auto;transform:translateX(-102%);transition:transform .45s var(--e-out);box-shadow:20px 0 50px rgba(0,0,0,.35)}
.mm.on .mm-panel{transform:none}
.mm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mm-logo{display:inline-flex;flex-direction:column;line-height:1}
.mm-logo .l1{font-weight:900;font-size:14px;letter-spacing:3px;margin-left:2px}
.mm-logo .l2{font-weight:900;font-size:22px;background:var(--red);padding:3px 9px 2px;margin-top:2px}
.mm-x{width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .25s,transform .35s var(--e-spring)}
.mm-x svg{width:20px;height:20px}.mm-x:hover{background:var(--red);transform:rotate(90deg)}
.mm-k{font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:0 0 8px}
.mm-list{display:flex;flex-direction:column}
.mm-list a{position:relative;display:flex;align-items:center;padding:13px 0 13px 18px;font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:#fff;text-decoration:none;opacity:0;transform:translateX(-14px);transition:opacity .4s var(--e-out),transform .4s var(--e-out),color .2s;transition-delay:calc(var(--i) * 35ms + 120ms)}
.mm-list a::before{content:'';position:absolute;left:0;top:50%;width:5px;height:0;background:var(--red);transform:translateY(-50%) skewY(-12deg);transition:height .3s var(--e-out)}
.mm-list a::after{content:'';position:absolute;left:18px;right:0;bottom:0;height:1px;background:rgba(255,255,255,.1)}
.mm.on .mm-list a{opacity:1;transform:none}
.mm-list a:focus-visible{color:#ffd0d3;outline:0}.mm-list a:focus-visible::before{height:60%}
@media (hover:hover){.mm-list a:hover{color:#ffd0d3}.mm-list a:hover::before{height:60%}}
.mm-list a.on{color:#fff}.mm-list a.on::before{height:80%}
.mm-list a.on span{border-bottom:3px solid var(--red);padding-bottom:2px}
.mm-search{margin-top:22px;display:flex;align-items:center;gap:10px;padding:13px 16px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:background .25s}
.mm-search svg{width:18px;height:18px}.mm-search:hover{background:var(--red)}
.mm-soc{margin-top:auto;padding-top:24px;display:flex;gap:10px;flex-wrap:wrap}
html.mm-lock{overflow:hidden}
@media (max-width:860px){.nav .tabs{display:none}.mbtn{display:flex}}
@media (prefers-reduced-motion:reduce){.mm-panel,.mm-list a{transition:none}}

.sowp{padding:8px 14px 8px 12px}
.sowp-logo{width:52px;height:20px;object-fit:contain;flex:none;transition:transform .45s var(--e-spring)}
.sowp .sowp-wa{width:16px;height:16px;opacity:.9}
.sowp:hover .sowp-logo,.sowp:focus-visible .sowp-logo{transform:translateY(-2px) scale(1.06)}

</style>

  if(urlCache[r]){ URL.revokeObjectURL(urlCache[r]); delete urlCache[r]; }
}
async function preload(){
  const refs = new Set();
  S.arts.forEach(a => [a.img, a.video, a.av, a.bg, ...bodyRefs(a.body)].forEach(r => isIdb(r) && refs.add(r)));

  if(isIdb(S.cfg.site.ogImg)) refs.add(S.cfg.site.ogImg);
  await Promise.all([...refs].map(async r => {
    try{ const b = await getBlob(r.slice(4)); if(b) urlCache[r] = URL.createObjectURL(b); }catch(e){}
  }));
}
function compress(file, max){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const w = Math.round(im.width * k), h = Math.round(im.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', .86);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); };
    im.src = u;
  });
}
const blobToData = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); });

/* =========================================================
   TEXTO ENRIQUECIDO DE LA NOTA
   Se guarda como texto sencillo:
     **negritas**  *cursivas*  [texto](https://enlace)
     ![Pie de foto](imagen)           → foto dentro del texto
     https://facebook.com/…  (sola)   → publicación de red social o video
     - punto                          → lista de puntos
   ========================================================= */
const RX_IMG = /^!\[([^\]]*)\]\((\S+?)\)$/;
const RX_URL = /^https?:\/\/[^\s<>"]+$/i;
const RX_LI = /^(?:-|•)\s*(.+)$/;
const okImg = s => /^(idb:|data:image\/|\/\.netlify\/functions\/api|https?:\/\/)/i.test(s || '');
function inlineTok(s, f = {}){
  const out = [], re = /\*\*(.+?)\*\*|\*([^*\n]+?)\*|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g; let last = 0, m;
  while((m = re.exec(s))){
    if(m.index > last) out.push({...f, s:s.slice(last, m.index)});
    if(m[1] !== undefined) out.push(...inlineTok(m[1], {...f, b:1}));
    else if(m[2] !== undefined) out.push(...inlineTok(m[2], {...f, i:1}));
    else out.push(...inlineTok(m[3], {...f, h:m[4]}));
    last = re.lastIndex;
  }
  if(last < s.length) out.push({...f, s:s.slice(last)});
  return out;
}
const plainLine = s => inlineTok(s).map(t => t.s).join('');
function bodyBlocks(body){
  return String(body || '').split(/\n+/).map(s => s.trim()).filter(Boolean).map(raw => {
    let m;
    if((m = raw.match(RX_IMG)) && okImg(m[2])) return {type:'img', cap:m[1].trim(), src:m[2]};
    if(RX_URL.test(raw)) return {type:'emb', url:raw};
    if((m = raw.match(RX_LI))) return {type:'li', raw:m[1], plain:plainLine(m[1])};
    return {type:'p', raw, plain:plainLine(raw)};
  });
}
/* texto limpio (sin marcas) para SEO, frases clave y conteos */
const plainParas = body => bodyBlocks(body).filter(b => b.type === 'p' || b.type === 'li').map(b => b.plain);
const plainBody = body => plainParas(body).join('\n\n');
const bodyRefs = body => bodyBlocks(body).filter(b => b.type === 'img').map(b => b.src);

const NETS = {fb:'Facebook', ig:'Instagram', x:'X (Twitter)', tk:'TikTok', yt:'YouTube', vm:'Vimeo', web:'Enlace'};
function socialOf(u){
  let m;
  if(/(?:youtube\.com|youtu\.be)\//i.test(u) && /(?:watch\?v=|embed\/|shorts\/|live\/|youtu\.be\/)[\w-]{11}/.test(u)) return {net:'yt'};
  if(/vimeo\.com\/(?:video\/)?\d+/i.test(u)) return {net:'vm'};
  if(/(?:facebook\.com|fb\.watch)\//i.test(u)){
    const vid = /\/videos\/|\/reel\/|fb\.watch|\/watch/i.test(u);
    return {net:'fb', src:`https://www.facebook.com/plugins/${vid ? 'video' : 'post'}.php?href=${encodeURIComponent(u)}&show_text=true&width=500`, h:vid ? 420 : 640, w:500};
  }
  if((m = u.match(/instagram\.com\/(?:[\w.]+\/)?(p|reel|tv)\/([\w-]+)/i))) return {net:'ig', src:`https://www.instagram.com/${m[1].toLowerCase() === 'tv' ? 'p' : m[1].toLowerCase()}/${m[2]}/embed/captioned/`, h:720, w:500};
  if((m = u.match(/(?:twitter\.com|x\.com)\/[\w]+\/status(?:es)?\/(\d+)/i))) return {net:'x', src:`https://platform.twitter.com/embed/Tweet.html?id=${m[1]}&lang=es`, h:560, w:550};
  if((m = u.match(/tiktok\.com\/@[\w.]+\/video\/(\d+)/i))) return {net:'tk', src:`https://www.tiktok.com/embed/v2/${m[1]}`, h:740, w:340};
  return {net:'web'};
}

/* convierte una línea con marcas a HTML, resaltando las frases clave */
function inlineHTML(raw, kp){
  const toks = inlineTok(raw), plain = toks.map(t => t.s).join(''), cuts = [];
  (kp || []).forEach((k, i) => { const j = k ? plain.indexOf(k) : -1; if(j >= 0 && !cuts.some(c => j < c[1] && j + k.length > c[0])) cuts.push([j, j + k.length, i]); });
  let pos = 0, out = '';
  toks.forEach(t => {
    const a0 = pos, a1 = pos + t.s.length; pos = a1;
    const pts = new Set([a0, a1]);
    cuts.forEach(([x, y]) => { if(x > a0 && x < a1) pts.add(x); if(y > a0 && y < a1) pts.add(y); });
    const ps = [...pts].sort((p, q) => p - q);
    let h = '';
    for(let n = 0; n < ps.length - 1; n++){
      const x = ps[n], y = ps[n + 1], c = cuts.find(q => x >= q[0] && y <= q[1]);
      const tx = esc(plain.slice(x, y));
      h += c ? `<mark class="kp" data-kp="${c[2]}">${tx}</mark>` : tx;
    }
    if(t.i) h = `<em>${h}</em>`;
    if(t.b) h = `<strong>${h}</strong>`;
    if(t.h) h = `<a href="${esc(t.h)}" target="_blank" rel="noopener">${h}</a>`;
    out += h;
  });
  return out;
}
/* bloques HTML del cuerpo de la nota */
function renderBody(body, kp){
  const out = []; let ul = null;
  const flush = () => { if(ul){ out.push(`<ul class="bul">${ul.join('')}</ul>`); ul = null; } };
  bodyBlocks(body).forEach(b => {
    if(b.type === 'li'){ (ul = ul || []).push(`<li>${inlineHTML(b.raw, kp)}</li>`); return; }
    flush();
    if(b.type === 'p') out.push(`<p>${inlineHTML(b.raw, kp)}</p>`);
    else if(b.type === 'img'){ const s = mediaUrl(b.src); if(s) out.push(`<figure class="bfig"><img src="${esc(s)}" alt="${esc(b.cap)}" loading="lazy" decoding="async" onerror="this.parentNode.remove()">${b.cap ? `<figcaption>${esc(b.cap)}</figcaption>` : ''}</figure>`); }
    else out.push(embedHTML(b.url));
  });
  flush();
  return out;
}
/* inserta el banner interno después del segundo párrafo de texto */
function withInline(pp, html){
  if(!html) return pp;
  let n = 0, at = pp.length;
  for(let i = 0; i < pp.length; i++) if(/^<(p|ul)/.test(pp[i]) && ++n === 2){ at = i + 1; break; }
  pp.splice(Math.min(at, pp.length), 0, html);
  return pp;
}

function serInline(n){
  if(n.nodeType === 3) return n.textContent.replace(/ /g, ' ');
  if(n.nodeType !== 1) return '';
  const tag = n.tagName, inner = () => [...n.childNodes].map(serInline).join('');
  if(tag === 'BR') return '\n';
  if(n.classList.contains('rb-img') || n.classList.contains('rb-emb')) return '\n' + serBlock(n) + '\n';
  const st = n.getAttribute('style') || '';
  const wrap = (s, m) => { const t = s.match(/^(\s*)([\s\S]*?)(\s*)$/); return t[2] ? t[1] + m + t[2] + m + t[3] : s; };
  if(tag === 'A'){ const h = n.getAttribute('href') || '', t = inner().replace(/[\[\]\n]/g, ' ').trim(); return /^https?:\/\//i.test(h) && t ? `[${t}](${h.replace(/[()\s]/g, encodeURIComponent)})` : inner(); }
  let s = inner();
  if(/^(DIV|P|H\d|LI|BLOCKQUOTE|SECTION)$/.test(tag)) s = '\n' + s + '\n';
  if(tag === 'B' || tag === 'STRONG' || /font-weight:\s*(bold|[6-9]00)/.test(st)) s = s.split('\n').map(x => wrap(x, '**')).join('\n');
  if(tag === 'I' || tag === 'EM' || /font-style:\s*italic/.test(st)) s = s.split('\n').map(x => wrap(x, '*')).join('\n');
  return s;
}
function serBlock(n){
  if(n.classList && n.classList.contains('rb-img')){ const c = (n.querySelector('.rb-cap') || {}).value || ''; return `![${c.replace(/[\[\]\n]/g, ' ').trim()}](${n.dataset.src})`; }
  if(n.classList && n.classList.contains('rb-emb')) return n.dataset.url;
  return serInline(n);
}
function serRich(root){
  return [...root.childNodes].map(serBlock).join('\n').split('\n').map(s => s.replace(/\*\*\*\*/g, '').replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n\n');
}
const rich = {range:null};
function richSave(){
  const ed = $('#e-rich'), sel = getSelection();
  if(!ed || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if(ed.contains(r.commonAncestorContainer)){ rich.range = r.cloneRange(); return; }
  /* selección que empieza o termina fuera del editor: se recorta al editor */
  if(ed.contains(r.startContainer) && ed.lastChild){ const c = r.cloneRange(); c.setEndAfter(ed.lastChild); rich.range = c; }

    if(s >= 3){ const st = S.stats; st.time[dw.id] = (st.time[dw.id] || 0) + s; st.reads[dw.id] = (st.reads[dw.id] || 0) + 1; qAdd('time', dw.id, s); qAdd('reads', dw.id); persist(); }
  }

}

function route(){
  dwellStop(); dw.id = null;
  const parts = cur().split('/').filter(Boolean);
  const isAdm = parts[0] === 'admin';
  document.body.classList.toggle('is-admin', isAdm);
  if(isAdm){
    clearTimeout(timer); closeModal(true);
    setSEO({title:'Administrador · ' + S.cfg.site.name, noindex:true, path:'admin'});
    if(SV.on && !SV.tok){ renderLogin(); return; }
    const lg = $('#login'); if(lg) lg.remove();
    renderAdmin(); window.scrollTo(0, 0); enterAnim(); maybeTour(); loadStats();
    if(SV.on && SV.empty){ SV.empty = false; pushServer(); }
    return;
  }
  endTour(); applyChrome();
  if(parts[0] === 'a' && parts[1] && byId(+parts[1])){ go(artPath(byId(+parts[1])), true); return; }   /* enlaces antiguos */
  let fn, key = '', seo, art = null;
  if(parts.length === 2 && ORDER.includes(parts[0])){
    const x = S.arts.find(z => z.slug === parts[1]);
    if(x && x.c !== parts[0]){ go(artPath(x), true); return; }
    art = x || null;
  }
  if(art){ key = art.c; seo = seoArticle(art); track('views', art.id); }
  else if(parts.length === 1 && ORDER.includes(parts[0])){ fn = () => vCat(parts[0]); key = parts[0]; seo = seoCategory(parts[0]); }
  else if(parts.length === 0 || (parts.length === 1 && /\.html?$/i.test(parts[0]))){ fn = vHome; seo = seoHome(); }
  else { fn = vNotFound; seo = {title:'Página no encontrada · ' + S.cfg.site.name, noindex:true, path:parts.join('/')}; }
  setSEO(seo); track('page'); loadGA();
  if(window.gtag) gtag('event', 'page_view', {page_title:document.title, page_location:location.href});
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.k === key));
  document.querySelectorAll('#mm-list a').forEach(a => a.classList.toggle('on', a.dataset.k === (key || '')));
  inkTo($('#tabs a.on'));
  closeMM(true);
  closeSearch();
  const path = parts.join('/');
  let bgPath = path, after = null;
  if(art){
    if(mdl.el){ if(mdl.id !== art.id) swapModal(art); dwellStart(art.id); first = false; return; }
    const pushed = mdlNav; mdlNav = false;
    if(view.dataset.path !== undefined && !first){ clearTimeout(timer); openModal(art, pushed); dwellStart(art.id); return; }
    fn = () => vCat(art.c); bgPath = art.c; after = () => { openModal(art, false); dwellStart(art.id); };
  }
  else if(mdl.el){
    closeModal();
    if(path === view.dataset.path){ first = false; return; }
  }
  const paint = () => { ri = 0; view.classList.remove('out'); view.innerHTML = fn(); view.dataset.path = bgPath; reveal(view); onScroll(); countShown(); if(after) after(); };
  const delay = DEMO_LOADER && !IS_BOT ? (first ? 1100 : 650) : 0;
  clearTimeout(timer);
  if(!delay){ paint(); }
  else {
    const done = progress(), wasFirst = first;
    const sk = () => { view.classList.remove('out'); view.innerHTML = skeleton(); if(!wasFirst) window.scrollTo({top:0, behavior:'smooth'}); timer = setTimeout(() => { paint(); done(); }, delay); };
    if(wasFirst || CALM) sk(); else { view.classList.add('out'); timer = setTimeout(sk, 170); }
  }
  first = false;
}

/* subir / quitar / crear / eliminar */
async function handleUpload(k, file){
  setStatus('saving');
  try{
    const isVid = k === 'video';
    if(isVid ? !file.type.startsWith('video/') : !file.type.startsWith('image/')) throw new Error('tipo');
    const blob = isVid ? file : await compress(file, k === 'av' ? 500 : 1800);
    let ref;
    if(SV.on && SV.tok) ref = await uploadMedia(blob);
    else {
      ref = 'idb:m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      try{ await putBlob(ref.slice(4), blob); urlCache[ref] = URL.createObjectURL(blob); }
      catch(err){ if(isVid) throw err; ref = await blobToData(blob); }
    }
    const old = TG[k].get();
    TG[k].set(ref); if(old !== ref) dropRef(old);
    save();
    if(ad.sec === 'noticias'){ renderItems(); renderEditor(); updateSeo(); } else renderAdmin();
    toast(isVid ? 'Video subido' : 'Imagen subida');
  }catch(err){
    setStatus('err'); toast(err.message === 'tipo' ? 'Ese archivo no es del tipo correcto' : err.message === 'grande' ? 'El archivo pesa más de 5 MB. Para videos largos usa un enlace de YouTube.' : err.message === 'sesion' ? 'Tu sesión terminó' : 'No se pudo subir el archivo');
  }
}
function removeMedia(k){
  const old = TG[k].get();
  dropRef(old); TG[k].set('');
  if(k === 'img') byId(ad.id).k = '';
  if(k === 'av') byId(ad.id).avn = 0;
  save();
  if(ad.sec === 'noticias'){ renderItems(); renderEditor(); } else renderAdmin();
}

async function resetAll(){

const tour = {i:0, on:false};
const raf2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
function startTour(){
  tour.on = true; tour.i = 0;

function endTour(){
  if(!tour.on) return;

  let seen = false; try{ seen = !!localStorage.getItem(TOUR); }catch(e){}
  if(!seen && !tour.on) setTimeout(() => { if(document.body.classList.contains('is-admin') && !tour.on) startTour(); }, 500);

async function showStep(){
  const s = STEPS[tour.i];
  if(s.sec && ad.sec !== s.sec){ goSec(s.sec); await raf2(); }
  if(s.tab && ad.tab !== s.tab){ setTab(s.tab); await raf2(); }
  const tip = $('#tour-tip');
  tip.querySelector('.tp-s').textContent = `Paso ${tour.i + 1} de ${STEPS.length}`;
  tip.querySelector('h4').textContent = s.t;
  tip.querySelector('p').textContent = s.d;
  tip.querySelector('.tp-dots').innerHTML = STEPS.map((_, i) => `<i class="${i <= tour.i ? 'on' : ''}"></i>`).join('');
  $('#tp-prev').style.visibility = tour.i ? 'visible' : 'hidden';
  $('#tp-next').textContent = tour.i === STEPS.length - 1 ? 'Terminar' : 'Siguiente';
  tip.classList.remove('swap'); void tip.offsetWidth; tip.classList.add('swap');
  placeTour();
}
function placeTour(){
  if(!tour.on) return;
  const s = STEPS[tour.i], tip = $('#tour-tip'), hole = $('#tour-hole');
  const vw = innerWidth, vh = innerHeight, W = tip.offsetWidth, H = tip.offsetHeight, g = 14, pad = 6;
  const el = s.sel && document.querySelector(s.sel);
  const clamp = (v, a, b) => Math.max(a, Math.min(v, b));
  if(!el){
    hole.style.outlineColor = 'transparent';
    Object.assign(hole.style, {left:'50%', top:'50%', width:'0px', height:'0px'});
    tip.style.left = (vw - W) / 2 + 'px'; tip.style.top = (vh - H) / 2 + 'px';
    return;
  }
  el.scrollIntoView({block: el.offsetHeight > vh * .6 ? 'start' : 'center', inline:'nearest'});
  const r = el.getBoundingClientRect();
  const top = Math.max(r.top, 8), bottom = Math.min(r.bottom, vh - 8), left = Math.max(r.left, 8), right = Math.min(r.right, vw - 8);
  hole.style.outlineColor = '#ff3b47';
  Object.assign(hole.style, {left:left - pad + 'px', top:top - pad + 'px', width:right - left + pad * 2 + 'px', height:bottom - top + pad * 2 + 'px'});
  const spots = {
    right:() => ({x:right + pad + g, y:clamp(top, 8, vh - H - 8), ok:right + pad + g + W <= vw - 8}),
    left:() => ({x:left - pad - g - W, y:clamp(top, 8, vh - H - 8), ok:left - pad - g - W >= 8}),
    below:() => ({x:clamp(left, 8, vw - W - 8), y:bottom + pad + g, ok:bottom + pad + g + H <= vh - 8}),
    above:() => ({x:clamp(left, 8, vw - W - 8), y:top - pad - g - H, ok:top - pad - g - H >= 8})
  };
  const order = [s.side, 'below', 'right', 'left', 'above'].filter(Boolean);
  let p = null;
  for(const k of order){ const c = spots[k](); if(c.ok){ p = c; break; } }
  if(!p) p = {x:(vw - W) / 2, y:vh - H - 16};
  tip.style.left = p.x + 'px'; tip.style.top = p.y + 'px';
}
$('#tp-next').addEventListener('click', () => { if(tour.i >= STEPS.length - 1) endTour(); else { tour.i++; showStep(); } });

  if(Array.isArray(o)) return o.map(clean).filter(x => x !== undefined && x !== '');
  if(o && typeof o === 'object'){
    const r = {};
    for(const k in o){ const v = clean(o[k]); if(v !== '' && v !== undefined && !(Array.isArray(v) && !v.length)) r[k] = v; }
    return r;
  }

};

const xe = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
const siteBase = () => SITE() || (PATHMODE ? location.origin : 'https://tu-sitio.com');
function buildSitemap(){
  const b = siteBase(), rows = [];
  const last = l => l.reduce((m, a) => { const d = a.mod || a.pub; return d > m ? d : m; }, '1970-01-01');
  rows.push([b + '/', last(S.arts)]);
  ORDER.forEach(k => { const l = S.arts.filter(a => a.c === k); if(l.length) rows.push([`${b}/${k}`, last(l)]); });
  S.arts.forEach(a => rows.push([`${b}/${artPath(a)}`, a.mod || a.pub]));
  return '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' +
    rows.map(([u, d]) => `  <url>\n    <loc>${xe(u)}</loc>\n    <lastmod>${new Date(d).toISOString()}</lastmod>\n  </url>`).join('\n') + '\n</urlset>\n';

  const b = siteBase(), s = S.cfg.site, items = [...S.arts].sort((x, y) => new Date(y.pub) - new Date(x.pub)).slice(0, 30);
  return `<?xml version="1.0" encoding="UTF-8"?>\n<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">\n<channel>\n<title>${xe(s.name)}</title>\n<link>${xe(b)}/</link>\n<description>${xe(S.cfg.seoDesc)}</description>\n<language>es-mx</language>\n<atom:link href="${xe(b)}/rss.xml" rel="self" type="application/rss+xml"/>\n` +
    items.map(a => `<item>\n<title>${xe(a.t)}</title>\n<link>${xe(b + '/' + artPath(a))}</link>\n<guid isPermaLink="true">${xe(b + '/' + artPath(a))}</guid>\n<pubDate>${new Date(a.pub).toUTCString()}</pubDate>\n<category>${xe(catN(a.c))}</category>\n<description>${xe(a.l)}</description>\n</item>`).join('\n') + '\n</channel>\n</rss>\n';
}
function download(name, text, mime){
  const u = URL.createObjectURL(new Blob([text], {type:mime || 'text/plain'}));
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} x.remove(); return ok; }
}

   ========================================================= */
const hex2rgb = h => [0, 2, 4].map(i => parseInt(h.replace('#', '').substr(i, 2), 16));

const lumOf = c => (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) / 255;
const mixC = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

function rolesFrom(cols){
  const P = cols.map(c => c.slice(0, 3));
  if(!P.length) P.push([27, 42, 138]);
  while(P.length < 4) P.push(mixC(P[P.length - 1], P[0], .5).map((v, i) => v * (i === 2 ? .9 : .8)));
  const d0 = [...P].sort((a, b) => lumOf(a) - lumOf(b))[0], l0 = lumOf(d0);
  const cd = l0 > .26 ? mixC(d0, [0, 0, 0], 1 - .26 / l0) : d0;
  const ca = [...P].sort((a, b) => satOf(b) * (.35 + lumOf(b)) - satOf(a) * (.35 + lumOf(a)))[0];
  return {c1:P[0], c2:P[1], c3:P[2], c4:P[3], cb:mixC(P[0], cd, .42), cd, ca};
}
const catPal = c => { const h = (CATG[c] || CATG.merida).match(/#[0-9a-f]{6}/gi).map(hex2rgb); return rolesFrom([h[0], h[1], mixC(h[0], h[1], .5), mixC(h[0], [211, 20, 31], .45)]); };
function paletteOf(src){
  const cv = document.createElement('canvas'); cv.width = cv.height = 48;
  const x = cv.getContext('2d', {willReadFrequently:true});
  x.drawImage(src, 0, 0, 48, 48);
  const d = x.getImageData(0, 0, 48, 48).data, m = new Map();
  for(let i = 0; i < d.length; i += 4){
    if(d[i + 3] < 128) continue;
    const k = (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4);
    let e = m.get(k); if(!e){ e = [0, 0, 0, 0]; m.set(k, e); }
    e[0] += d[i]; e[1] += d[i + 1]; e[2] += d[i + 2]; e[3]++;
  }
  const arr = [...m.values()].map(e => [e[0] / e[3], e[1] / e[3], e[2] / e[3], e[3]]).sort((a, b) => b[3] - a[3]), pick = [];
  for(const c of arr){ if(pick.every(p => Math.hypot(p[0] - c[0], p[1] - c[1], p[2] - c[2]) > 52)) pick.push(c); if(pick.length >= 5) break; }
  return rolesFrom(pick);
}
const loadImg = src => new Promise((res, rej) => {

const frameOf = src => new Promise((res, rej) => {
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
  if(/^https?:/.test(src)) v.crossOrigin = 'anonymous';

  v.addEventListener('seeked', () => res(v), {once:true});

});
const frameData = v => { const c = document.createElement('canvas'); c.width = 320; c.height = Math.round(320 * (v.videoHeight || 9) / (v.videoWidth || 16)); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .7); };
const ytId = v => { const m = String(v || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/); return m ? m[1] : ''; };
function palSources(a){
  const L = [];
  if(a.bg) L.push({k:'img', src:mediaUrl(a.bg)});
  if(a.img) L.push({k:'img', src:mediaUrl(a.img)});
  if(a.video){ const y = ytId(a.video); if(y) L.push({k:'img', src:`https://i.ytimg.com/vi/${y}/hqdefault.jpg`}); else if(!/vimeo\.com/.test(a.video)) L.push({k:'video', src:mediaUrl(a.video)}); }

}

function markText(str, kp){
  let out = '', rest = str;
  for(;;){
    let bi = -1, bk = -1;
    kp.forEach((k, i) => { const j = rest.indexOf(k); if(j >= 0 && (bi < 0 || j < bi)){ bi = j; bk = i; } });
    if(bi < 0) break;
    out += esc(rest.slice(0, bi)) + `<mark class="kp" data-kp="${bk}">${esc(kp[bk])}</mark>`;
    rest = rest.slice(bi + kp[bk].length);
  }
  return out + esc(rest);
}

const STOP = new Set('para como esta este estos estas sobre entre desde hasta donde cuando tras ante bajo contra durante mediante segun sera seran tiene tienen hace hacen nuevo nueva nuevos nuevas mas muy todo toda todos todas otra otro sus una uno unos unas que con del los las por'.split(' '));
function genLocal(f){
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1), low = s => s.charAt(0).toLowerCase() + s.slice(1);
  const cl = s => String(s || '').trim().replace(/\s+/g, ' ').replace(/[.]+$/, '');

  const facts = String(f.d || '').split(/\n+/).map(s => cl(s).replace(/^[-•*·]\s*/, '')).filter(Boolean);
  let t = cap(what); if(t.length > 90) t = t.slice(0, t.lastIndexOf(' ', 86));
  const when = f.date ? new Date(f.date + 'T12:00').toLocaleDateString('es-MX', {day:'numeric', month:'long'}) : '';
  const srcIn = src && norm(what).includes(norm(src).replace(/^(el|la|los|las)\s+/, ''));
  const l = src && !srcIn ? `${cap(src)} informó que ${low(what)}.` : facts.length ? `${cap(what)}; ${low(facts[0])}.` : `${cap(what)}. Esto es lo que se sabe hasta ahora.`;
  const P = [`${place.toUpperCase()}${when ? ', ' + when : ''}.— ${cap(what)}${src && !srcIn ? ', de acuerdo con ' + low(src) : ''}.`];
  if(facts.length){
    const fs = facts.map(x => cap(x) + '.');
    if(fs.length > 3){ P.push(fs.slice(0, Math.ceil(fs.length / 2)).join(' ')); P.push(fs.slice(Math.ceil(fs.length / 2)).join(' ')); }
    else P.push(fs.join(' '));
  }

  const sw = new Set(norm(src + ' ' + place).split(/[^a-z0-9ñ]+/));
